<!DOCTYPE html>  
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Have Something</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        background: radial-gradient(circle at center,#1a0b1f 0%, #0b0012 100%);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        color:#fff;
    }
    h1{
        font-family:'Dancing Script',cursive;
        font-size:3.5rem;
        background:linear-gradient(90deg,#ff9ac2,#ff7fd0,#ff90f0);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        text-shadow:0 0 20px rgba(255,170,210,0.6);
        margin-bottom:30px;
        opacity:0;
        animation:fadeIn 2s forwards;
    }
    .btn{
        font-family:'Poppins',sans-serif;
        padding:12px 28px;
        background:linear-gradient(90deg,#ff88d2,#ff6ec4);
        border:none;
        border-radius:30px;
        color:#fff;
        font-weight:600;
        cursor:pointer;
        box-shadow:0 0 15px rgba(255,120,200,0.5);
        transition:.3s;
        margin:8px;
    }
    .btn:hover{
        box-shadow:0 0 25px rgba(255,150,220,0.8);
        transform:scale(1.05);
    }
    .card{
        display:none;
        text-align:center;
        max-width:700px;
        margin-top:30px;
        padding:30px;
        border-radius:20px;
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(8px);
        box-shadow:0 0 25px rgba(255,150,220,0.4);
        animation:fadeIn 1s forwards;
    }
    .card h2{
        background:linear-gradient(90deg,#ff9ac2,#ff7fd0,#ff90f0);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        font-family:'Dancing Script',cursive;
        font-size:2.5rem;
        margin-bottom:15px;
    }
    .card p{
        font-family:'Poppins',sans-serif;
        line-height:1.6;
        color:#f5e7f0;
        margin-bottom:20px;
    }

    /* Slideshow */
    .slideshow-container{
        position:relative;
        max-width:100%;
        margin:auto;
    }
    .slide{
        display:none;
    }
    .slide img{
        width:100%;
        border-radius:15px;
        box-shadow:0 0 12px rgba(255,150,220,0.5);
    }
    .fade{animation:fadeEffect 1.2s;}
    @keyframes fadeEffect{from{opacity:0.4;} to{opacity:1;}}
    .prev, .next{
        cursor:pointer;
        position:absolute;
        top:50%;
        width:auto;
        margin-top:-22px;
        padding:16px;
        color:white;
        font-weight:bold;
        font-size:20px;
        transition:0.3s;
        border-radius:0 3px 3px 0;
        user-select:none;
        background:rgba(0,0,0,0.3);
    }
    .next{right:0;border-radius:3px 0 0 3px;}
    .prev:hover, .next:hover{background:rgba(0,0,0,0.6);}
    @keyframes fadeIn{to{opacity:1;}}
</style>
</head>
<body>

<h1 id="intro">I Have Something</h1>
<button class="btn" id="openBtn">✨ Open ✨</button>

<div class="card" id="wishCard">
    <h2>Happy 18th Birthday, Sabrina! 🎀</h2>
    <p>
        Selamat ulang tahun ke-18, Sabrina (1 Oktober).  
        Semoga harimu penuh warna, cinta, dan impian yang jadi nyata.  
        Teruslah bersinar seindah bintang dan seromantis mawar pink ✨
    </p>

    <!-- Slideshow Foto -->
    <div class="slideshow-container">
        <div class="slide fade">
            <img src="foto1.jpg" alt="Foto 1">
        </div>
        <div class="slide fade">
            <img src="foto2.jpg" alt="Foto 2">
        </div>
        <div class="slide fade">
            <img src="foto3.jpg" alt="Foto 3">
        </div>
        <div class="slide fade">
            <img src="foto4.jpg" alt="Foto 4">
        </div>
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
</div>

<!-- Backsound -->
<audio id="backsound" src="backsound.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const openBtn   = document.getElementById('openBtn');
const card      = document.getElementById('wishCard');
const backsound = document.getElementById('backsound');

openBtn.addEventListener('click', ()=>{
    openBtn.style.display='none';
    card.style.display='block';
    backsound.play();

    // confetti efek
    const duration = 3000;
    const end = Date.now() + duration;
    (function frame(){
        confetti({
          particleCount:6, angle:60, spread:70, origin:{x:0},
          colors:['#ff9ac2','#ff7fd0','#ff90f0','#ffffff']
        });
        confetti({
          particleCount:6, angle:120, spread:70, origin:{x:1},
          colors:['#ff9ac2','#ff7fd0','#ff90f0','#ffffff']
        });
        if(Date.now() < end) requestAnimationFrame(frame);
    })();
});

/* Slideshow */
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n){ showSlides(slideIndex += n); }
function showSlides(n){
    let i;
    let slides=document.getElementsByClassName("slide");
    if(n>slides.length){slideIndex=1}
    if(n<1){slideIndex=slides.length}
    for(i=0;i<slides.length;i++){slides[i].style.display="none";}
    slides[slideIndex-1].style.display="block";
}

// Auto geser tiap 4 detik
setInterval(()=>{plusSlides(1)},4000);
</script>

</body>
</html>
